name: Track ROM downloads

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rom-download-statistics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install chart dependency
        run: python -m pip install matplotlib

      - name: Collect counters and regenerate charts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/track_downloads.py --repository Lineage-BBKey2/distribution

      - name: Commit statistics to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/downloads.csv stats/downloads-total.svg stats/downloads-30days.svg
          git rm --ignore-unmatch -- stats/downloads-rate.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update ROM download statistics"
          git pull --rebase origin main
          git push origin HEAD:main
